<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — Zentry</title>
<meta name="description" content="The page you were looking for could not be found.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1B2B">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<style>
  :root{--navy:#0B1B2B;--teal:#00D6B4;--mist:#C1D0DC;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(820px 420px at 88% -12%,#163B53 0%,var(--navy) 55%);color:#fff;font:16px/1.7 var(--sans);padding:24px}
  main{max-width:560px;text-align:center}
  .k{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.22em;color:var(--teal)}
  h1{margin:0 0 14px;font-size:clamp(30px,6vw,46px);line-height:1.1;letter-spacing:-.02em}
  p{color:var(--mist);margin:0 0 28px}
  a{display:inline-block;background:var(--teal);color:#04231E;font-weight:700;text-decoration:none;padding:13px 22px;border-radius:8px}
  a:hover{background:#2ee3c5}
  :focus-visible{outline:3px solid var(--teal);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="k">404</p>
  <h1>That page doesn't exist.</h1>
  <p>It may have moved, or the link may be wrong. Everything worth finding is one click away.</p>
  <a href="./">Back to Zentry &rarr;</a>
</main>
</body>
</html>
